name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Read and verify version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "${package_version}" = "${manifest_version}"
          if test "${GITHUB_REF_TYPE}" = "tag"; then
            test "${GITHUB_REF_NAME}" = "${manifest_version}"
          fi
          echo "RELEASE_VERSION=${manifest_version}" >> "${GITHUB_ENV}"

      - name: Build and verify
        run: |
          npm ci
          npm run verify

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css
          test "$(node -p "require('./manifest.json').id")" = "wechat-link-sync"
          if grep -Eq '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|wx[0-9a-f]{16})' main.js manifest.json styles.css; then
            echo "Potential secret found in release assets" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_VERSION} already exists; nothing to publish."
            exit 0
          fi
          if ! git rev-parse "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            git tag "${RELEASE_VERSION}" "${GITHUB_SHA}"
            git push origin "${RELEASE_VERSION}"
          fi
          gh release create "${RELEASE_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "WeChat Link Sync ${RELEASE_VERSION}" \
            --notes-file CHANGELOG.md \
            main.js manifest.json styles.css
