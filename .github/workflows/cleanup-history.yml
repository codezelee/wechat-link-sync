name: Prepare public history

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[history-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify clean release source
        run: |
          npm ci
          npm run verify

      - name: Replace public history and releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release delete 1.5.0 --yes --cleanup-tag || true
          gh release delete 1.6.0 --yes --cleanup-tag || true

          git config user.name "codezelee"
          git config user.email "46240928+codezelee@users.noreply.github.com"
          git checkout --orphan clean-main
          git add -A
          git commit -m "Initial public release of WeChat Link Sync"

          clean_sha="$(git rev-parse HEAD)"
          git push --force origin HEAD:main
          git tag 1.6.0 "${clean_sha}"
          git push origin refs/tags/1.6.0
          gh release create 1.6.0 \
            --target "${clean_sha}" \
            --title "WeChat Link Sync 1.6.0" \
            --notes-file CHANGELOG.md \
            main.js manifest.json styles.css

          for attempt in 1 2 3; do
            while read -r run_id; do
              if [ -n "${run_id}" ] && [ "${run_id}" != "${GITHUB_RUN_ID}" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
              fi
            done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id')
            sleep 5
          done
